<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Baby ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Parisienne&display=swap" rel="stylesheet">
</head>

<body>
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
<div id="hearts"></div>

<!-- PASSWORD PAGE -->

<div class="page active" id="passwordPage">

<h1>Only my baby can open this. 🤍</h1>

<input
type="password"
id="password"
placeholder="Enter password">

<button onclick="checkPassword()">
Unlock My Heart ✨
</button>

<p id="wrong"></p>

</div>

<!-- ENVELOPE PAGE -->

<div class="page" id="envelopePage">

<div class="envelope" onclick="openLetter()">

💌

<div class="sparkle"></div>

</div>

</div>

<h2>Open Your Letter, Baby 💗</h2>

</div>

<!-- LETTER PAGE -->

<div class="page" id="letterPage">

<div class="letter">

<h1>November 24, 2025</h1>

<p>

<p id="typewriter"></p>

</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
